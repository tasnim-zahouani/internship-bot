name: Daily Internship Finder

on:
  schedule:
    # Runs at 6:00 AM UTC every day (which is 8:00 AM in France during summer time)
    - cron: '0 6 * * *' 
  workflow_dispatch: # This adds a button so you can trigger it manually to test it

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Dependencies
        run: pip install -r requirements.txt
        
      - name: Run Python Script
        env:
            PYTHONUNBUFFERED: "1"
            GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
            DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python -u main.py